[project]
name = "shared"
version = "0.0.1"
description = "Shared schemas + observability helpers for the Glasses-3D-Twin pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "logfire>=0.50",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
