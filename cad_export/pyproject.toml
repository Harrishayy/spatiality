[project]
name = "cad_export"
version = "0.0.4"
description = "CAD export — per-object watertight meshes (3MF/OBJ/STL) from splat + annotations. Spec: 11_cad_export.md."
requires-python = ">=3.11"
dependencies = [
    "shared",
    "logfire>=0.50",
    "numpy>=1.26",
    "pillow>=10",
    "plyfile>=1.0",
    "scipy>=1.13",                 # KDTree for hausdorff/chamfer; bbox geometry
    "trimesh>=4.4",                # mesh I/O (OBJ/STL/3MF), repair, decimation
    "networkx>=3",                 # required by trimesh's 3MF + scene graph code
    "lxml>=5",                     # required by trimesh's 3MF writer
    "open3d>=0.18",                # scaled ICP + screened Poisson
    # nksr + trellis2 are best-effort GPU-only deps; installed inside the
    # Modal image in E3, not required for local fixture-driven testing.
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad_export"]
