[project]
name = "inference"
version = "0.0.1"
description = "Inference module — frames to splat (VGGT depth + per-pixel surfel synthesis)."
requires-python = ">=3.11"
dependencies = [
    "shared",
    "logfire>=0.50",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference"]
