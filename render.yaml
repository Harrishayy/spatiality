services:
  - type: web
    name: spatiality-agent
    runtime: node
    plan: starter   # $7/mo so the service doesn't sleep mid-demo
    buildCommand: pnpm install && pnpm --filter ./agent build
    startCommand: pnpm --filter ./agent start
    rootDir: .
    envVars:
      - key: NODE_VERSION
        value: 20
      # Cloudflare R2 — required for r2 mode (production path)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_UPLOADS_BUCKET
        value: glasses-twin-uploads
      - key: R2_ARTIFACTS_BUCKET
        value: glasses-twin-artifacts
      - key: R2_ARTIFACTS_PUBLIC_BASE
        sync: false
      # Modal endpoint URLs (printed by `modal deploy inference/modal_app.py`)
      - key: MODAL_PROCESS_VIDEO_URL
        sync: false
      - key: MODAL_GET_MANIFEST_URL
        sync: false
      # Allowed CORS origins (comma-separated)
      - key: CORS_ORIGINS
        sync: false
      # Existing
      - key: PYDANTIC_GATEWAY_URL
        sync: false
      - key: PYDANTIC_GATEWAY_KEY
        sync: false
      - key: PYDANTIC_GATEWAY_REQUIRED
        value: "1"
      - key: LOGFIRE_TOKEN
        sync: false
      # Logfire READ token (separate from write/ingest token) — powers /api/trace
      - key: LOGFIRE_READ_TOKEN
        sync: false
      - key: LOGFIRE_READ_URL
        value: https://logfire-eu.pydantic.dev/v1/query
      - key: MODAL_INFERENCE_URL
        sync: false
      - key: ARTIFACTS_PATH
        value: /var/data/artifacts
    disk:
      name: artifacts
      mountPath: /var/data/artifacts
      sizeGB: 10

  - type: web
    name: spatiality-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter ./web build
    startCommand: pnpm --filter ./web start
    rootDir: .
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_AGENT_URL
        sync: false
      - key: NEXT_PUBLIC_R2_ARTIFACTS_PUBLIC_BASE
        sync: false
      - key: NEXT_PUBLIC_MODAL_GET_ARTIFACT_URL
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_MODE
        value: r2
      # Browser deep-link to Logfire project (drives "Open in Logfire ↗" links in trace drawer)
      - key: NEXT_PUBLIC_LOGFIRE_PROJECT_URL
        sync: false
