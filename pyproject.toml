[project]
name = "glasses-twin"
version = "0.0.1"
description = "Glasses to 3D Twin pipeline (root workspace)."
requires-python = ">=3.11"
dependencies = [
    "shared",
    "capture",
    "inference",
    "segmentation",
    "modal>=0.64",
]

[tool.uv.workspace]
members = ["shared", "capture", "inference", "segmentation"]

[tool.uv.sources]
shared = { workspace = true }
capture = { workspace = true }
inference = { workspace = true }
segmentation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
